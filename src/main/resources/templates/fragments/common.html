<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>

<!-- Public Navigation Bar -->
<header th:fragment="publicNavbar" class="public-navbar">

    <a th:href="@{/}" class="navbar-brand">
        <span class="brand-icon">D</span>
        <span>Digital Lending</span>
    </a>

    <nav class="navbar-links">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/login}">Login</a>
        <a th:href="@{/register}" class="navbar-register">
            Get Started
        </a>
    </nav>

</header>


<!-- Borrower Sidebar -->
<aside th:fragment="borrowerSidebar(activePage)"
       class="dashboard-sidebar">

    <a th:href="@{/}" class="dashboard-brand">
        <span class="brand-icon">D</span>
        <span>Digital Lending</span>
    </a>

    <nav class="dashboard-nav">

        <a th:href="@{/borrower/dashboard}"
           th:classappend="${activePage == 'dashboard'} ? ' active' : ''">
            Dashboard
        </a>

        <a th:href="@{/borrower/apply-loan}"
           th:classappend="${activePage == 'apply-loan'} ? ' active' : ''">
            Apply for Loan
        </a>

        <a th:href="@{/borrower/loans}"
           th:classappend="${activePage == 'loans'} ? ' active' : ''">
            My Loans
        </a>

        <a th:href="@{/borrower/repayments}"
           th:classappend="${activePage == 'repayments'} ? ' active' : ''">
            Repayments
        </a>

        <a th:href="@{/borrower/profile}"
           th:classappend="${activePage == 'profile'} ? ' active' : ''">
            My Profile
        </a>

    </nav>

    <a th:href="@{/login}" class="dashboard-logout">
        Logout
    </a>

</aside>


<!-- Admin Sidebar -->
<aside th:fragment="adminSidebar(activePage)" class="dashboard-sidebar">

    <a th:href="@{/}" class="dashboard-brand">
        <span class="brand-icon">D</span>
        <span>Digital Lending</span>
    </a>

    <nav class="dashboard-nav">

        <a th:href="@{/admin/dashboard}"
           th:classappend="${activePage == 'dashboard'} ? ' active' : ''">
            Dashboard
        </a>

        <a th:href="@{/admin/applications}"
           th:classappend="${activePage == 'applications'} ? ' active' : ''">
            Loan Applications
        </a>

        <a th:href="@{/admin/loans}"
           th:classappend="${activePage == 'loans'} ? ' active' : ''">
            All Loans
        </a>

        <a th:href="@{/admin/repayments}"
           th:classappend="${activePage == 'repayments'} ? ' active' : ''">
            Repayments
        </a>

    </nav>

    <a th:href="@{/login}" class="dashboard-logout">Logout</a>

</aside>



<!-- Common Footer -->
<footer th:fragment="pageFooter" class="common-footer">

    <p>
        © 2026 Digital Lending System.
        All rights reserved.
    </p>

</footer>

</body>
</html>
