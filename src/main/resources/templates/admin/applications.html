
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Applications | Digital Lending</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="dashboard-page">

<div class="dashboard-container">

    <!-- Admin Sidebar -->
    <aside th:replace="~{fragments/common :: adminSidebar('applications')}"></aside>

    <!-- Main Content -->
    <main class="dashboard-main">

        <header class="dashboard-header">
            <div>
                <h1>Loan Applications</h1>
                <p>Review and manage borrower loan applications.</p>
            </div>

            <div class="dashboard-user">
                <div class="user-avatar">A</div>
                <span>Administrator</span>
            </div>
        </header>

        <!-- Application Summary -->
        <section class="dashboard-section">
            <div class="summary-grid">

                <div class="summary-card">
                    <p>Total Applications</p>
                    <h2 id="totalApplications">0</h2>
                </div>

                <div class="summary-card">
                    <p>Pending</p>
                    <h2 id="pendingApplications">0</h2>
                </div>

                <div class="summary-card">
                    <p>Approved</p>
                    <h2 id="approvedApplications">0</h2>
                </div>

                <div class="summary-card">
                    <p>Rejected</p>
                    <h2 id="rejectedApplications">0</h2>
                </div>

            </div>
        </section>

        <!-- Applications Table -->
        <section class="loans-table-section">

            <div class="section-heading">
                <h2>All Applications</h2>
                <p>Review borrower details and application status.</p>
            </div>

            <div class="table-responsive">
                <table class="loans-table">

                    <thead>
                    <tr>
                        <th>Application ID</th>
                        <th>Borrower</th>
                        <th>Loan Amount</th>
                        <th>Tenure</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                    </thead>

                    <tbody id="applicationsTableBody">
                    <tr>
                        <td colspan="6" class="empty-table-message">
                            Loading applications...
                        </td>
                    </tr>
                    </tbody>

                </table>
            </div>

        </section>

    </main>

</div>


<script th:src="@{/js/admin-applications.js}"></script>
</body>
</html>
