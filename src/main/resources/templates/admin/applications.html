<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Applications | Digital Lending</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">


    <style>
        /* Action buttons container */
        .application-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }

        /* Common button styling */
        .action-btn {
            border: none;
            padding: 9px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Approve button */
        .approve-btn {
            background: #e0f5f0;
            color: #087f68;
            border: 1px solid #b7e8dc;
        }

        .approve-btn:hover {
            background: #087f68;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(8, 127, 104, 0.18);
            transform: translateY(-2px);
        }

        /* Reject button */
        .reject-btn {
            background: #fff0f0;
            color: #c03945;
            border: 1px solid #f3c5c8;
        }

        .reject-btn:hover {
            background: #c03945;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(192, 57, 69, 0.18);
            transform: translateY(-2px);
        }

        /* Keyboard accessibility */
        .action-btn:focus-visible {
            outline: 3px solid rgba(20, 150, 130, 0.3);
            outline-offset: 3px;
        }

        .action-btn:active {
            transform: scale(0.97);
        }
    </style>


</head>
<body class="dashboard-page">

<div class="dashboard-container">

    <!-- Admin Sidebar -->
    <aside th:replace="~{fragments/common :: adminSidebar('applications')}"></aside>

    <!-- Main Content -->
    <main class="dashboard-main">

        <header class="dashboard-header">
            <div>
                <h1>Loan Applications</h1>
                <p>Review and manage borrower loan applications.</p>
            </div>

            <div class="dashboard-user">
                <div class="user-avatar">A</div>
                <span>Administrator</span>
            </div>
        </header>

        <!-- Application Summary -->
        <section class="dashboard-section">
            <div class="summary-grid">

                <div class="summary-card">
                    <p>Total Applications</p>
                    <h2 id="totalApplications">0</h2>
                </div>

                <div class="summary-card">
                    <p>Pending</p>
                    <h2 id="pendingApplications">0</h2>
                </div>

                <div class="summary-card">
                    <p>Approved</p>
                    <h2 id="approvedApplications">0</h2>
                </div>

                <div class="summary-card">
                    <p>Rejected</p>
                    <h2 id="rejectedApplications">0</h2>
                </div>

            </div>
        </section>

        <!-- Applications Table -->
        <section class="loans-table-section">

            <div class="section-heading">
                <h2>All Applications</h2>
                <p>Review borrower details and application status.</p>
            </div>

            <p id="applicationsMessage" class="form-message"></p>

            <div class="table-responsive">
                <table class="loans-table">

                    <thead>
                    <tr>
                        <th>Application ID</th>
                        <th>Borrower</th>
                        <th>Loan Amount</th>
                        <th>Tenure</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                    </thead>

                    <tbody id="applicationsTableBody">
                    <tr>
                        <td colspan="6" class="empty-table-message">
                            Loading applications...
                        </td>
                    </tr>
                    </tbody>

                </table>
            </div>

        </section>

    </main>

    <input type="hidden" id="csrfToken"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">

</div>


<script th:src="@{/js/admin-applications.js}"></script>
</body>
</html>
