<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Digital Lending</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">


    <style>
        /* Profile section */
        .profile-section {
            background: #ffffff;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 4px 18px rgba(15, 23, 42, 0.05);
        }

        /* Profile header */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .profile-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #e0f2f1;
            color: #0f766e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 700;
        }

        .profile-heading h2 {
            margin: 0 0 6px;
            color: #0f172a;
        }

        .profile-heading p {
            margin: 0;
            color: #64748b;
            font-size: 14px;
        }

        .profile-divider {
            height: 1px;
            background: #e2e8f0;
            margin: 26px 0;
        }

        /* Section headings */
        .profile-details-section h3 {
            font-size: 18px;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .profile-details-section > p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 22px;
        }

        /* Details grid */
        .profile-details-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
            margin-top: 20px;
        }

        .profile-detail {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 16px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
        }

        .profile-detail span {
            color: #64748b;
            font-size: 13px;
        }

        .profile-detail strong {
            color: #0f172a;
            font-size: 15px;
        }

        /* Form fields */
        #borrowerProfileForm {
            margin-top: 24px;
        }

        #borrowerProfileForm .form-group {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        #borrowerProfileForm label {
            color: #334155;
            font-size: 14px;
            font-weight: 600;
        }

        #borrowerProfileForm input,
        #borrowerProfileForm select,
        #borrowerProfileForm textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background: #ffffff;
            color: #0f172a;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #borrowerProfileForm textarea {
            min-height: 90px;
            resize: vertical;
        }

        #borrowerProfileForm input:focus,
        #borrowerProfileForm select:focus,
        #borrowerProfileForm textarea:focus {
            border-color: #0d9488;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
        }

        #borrowerProfileForm .login-button {
            margin-top: 22px;
            padding: 12px 24px;
            border: none;
            border-radius: 9px;
            background: #0f766e;
            color: #ffffff;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        #borrowerProfileForm .login-button:hover {
            background: #115e59;
        }

        /* Success and error messages */
        .form-message {
            margin-top: 16px;
            font-size: 14px;
        }

        .form-message.success {
            color: #15803d;
        }

        .form-message.error {
            color: #dc2626;
        }

        /* Responsive layout */
        @media (max-width: 768px) {
            .profile-section {
                padding: 18px;
            }

            .profile-details-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            #borrowerProfileForm .login-button {
                width: 100%;
            }
        }
    </style>

</head>

<body class="dashboard-page">

<div class="dashboard-container">

    <!-- Reusable Borrower Sidebar -->
    <div th:replace="~{fragments/common :: borrowerSidebar('profile')}"></div>

    <!-- Main Content -->
    <main class="dashboard-main">

        <header class="dashboard-header">
            <div>
                <h1>My Profile</h1>
                <p>View and manage your personal information.</p>
            </div>
        </header>

        <!-- Profile Information -->
        <section class="profile-section">

            <div class="profile-header">
                <div class="profile-avatar"
                     th:text="${#strings.substring(user.name, 0, 1).toUpperCase()}">
                    B
                </div>

                <div class="profile-heading">
                    <h2 th:text="${user.name}">Borrower Name</h2>
                    <p th:text="${user.role}">Borrower Account</p>
                </div>

<!--                <button type="button" class="edit-profile-button">-->
<!--                    Edit Profile-->
<!--                </button>-->
            </div>

            <div class="profile-divider"></div>

            <!-- Personal Details -->
            <div class="profile-details-section">

                <h3>Personal Information</h3>

                <div class="profile-details-grid">

                    <div class="profile-detail">
                        <span>Full Name</span>
                        <strong th:text="${user.name}">Borrower Name</strong>
                    </div>

                    <div class="profile-detail">
                        <span>Email Address</span>
                        <strong th:text="${user.email}">borrower@example.com</strong>
                    </div>


                </div>

            </div>

            <div class="profile-divider"></div>

            <!-- Employment Details -->

            <div class="profile-details-section">

                <h3>Complete Your Borrower Profile</h3>

                <p>Provide these details before applying for a loan.</p>

                <form id="borrowerProfileForm" method="post">

                    <!-- CSRF Token -->
                    <input
                            type="hidden"
                            id="csrfToken"
                            th:name="${_csrf.parameterName}"
                            th:value="${_csrf.token}">

                    <div class="profile-details-grid">

                        <!-- Phone -->
                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input
                                    type="tel"
                                    id="phone"
                                    name="phone"
                                    placeholder="Enter phone number"
                                    pattern="[0-9+()\- ]{7,15}"
                                    maxlength="15"
                                    required>
                        </div>

                        <!-- Address -->
                        <div class="form-group">
                            <label for="address">Address</label>
                            <textarea
                                    id="address"
                                    name="address"
                                    placeholder="Enter your address"
                                    maxlength="255"
                                    required></textarea>
                        </div>

                        <!-- Monthly Income -->
                        <div class="form-group">
                            <label for="monthlyIncome">Monthly Income (₹)</label>
                            <input
                                    type="number"
                                    id="monthlyIncome"
                                    name="monthlyIncome"
                                    placeholder="Enter monthly income"
                                    min="0.01"
                                    step="0.01"
                                    required>
                        </div>

                        <!-- Employment Type -->
                        <div class="form-group">
                            <label for="employmentType">Employment Type</label>
                            <select
                                    id="employmentType"
                                    name="employmentType"
                                    required>

                                <option value="">Select employment type</option>
                                <option value="SALARIED">Salaried</option>
                                <option value="SELF_EMPLOYED">Self Employed</option>
                                <option value="BUSINESS">Business</option>
                                <option value="STUDENT">Student</option>
                                <option value="UNEMPLOYED">Unemployed</option>
                                <option value="OTHER">Other</option>

                            </select>
                        </div>

                    </div>

                    <div id="profileMessage" class="form-message"></div>

                    <button type="submit" class="login-button">
                        Save Borrower Profile
                    </button>

                </form>

            </div>


        </section>

    </main>

</div>

<script th:src="@{/js/borrower-profile.js}"></script>
</body>
</html>
